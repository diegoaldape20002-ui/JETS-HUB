<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#003F2D"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Jets Hub"/>
<title>New York Jets Fan Hub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f3f4f6;min-height:100vh}
.container{max-width:700px;margin:0 auto;padding:16px}
.header{background:#003F2D;border-radius:14px;padding:22px 20px 18px;color:#fff}
.header-top{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.logo{width:52px;height:52px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#003F2D;letter-spacing:-1px;flex-shrink:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:20px;border:none;cursor:pointer;font-size:13px;font-weight:500;background:rgba(255,255,255,0.18);color:#fff;transition:all 0.15s}
.tab.active{background:#fff;color:#003F2D}
.content{background:#fff;border:0.5px solid #e5e7eb;border-radius:0 0 14px 14px;padding:18px}
.content-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.content-title{font-size:16px;font-weight:500;color:#111}
.refresh-btn{font-size:12px;padding:4px 10px;border:0.5px solid #d1d5db;border-radius:6px;background:transparent;cursor:pointer;color:#6b7280}
.spinner{display:flex;align-items:center;gap:10px;padding:2rem 0}
.spin{width:18px;height:18px;border:2.5px solid #ddd;border-top:2.5px solid #00A86B;border-radius:50%;animation:spin 0.7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.spin-text{font-size:13px;color:#6b7280}
.error-box{background:#fff0f0;border:0.5px solid #fca5a5;border-radius:10px;padding:14px;margin-top:8px}
.error-title{font-size:13px;color:#991b1b;font-weight:500;margin-bottom:4px}
.error-msg{font-size:12px;color:#7f1d1d;font-family:monospace;word-break:break-all;margin-bottom:10px}
.retry-btn{font-size:12px;padding:4px 12px;border:0.5px solid #fca5a5;border-radius:6px;background:#fff;cursor:pointer;color:#991b1b}
.news-item{border-bottom:0.5px solid #e5e7eb;padding-bottom:16px;margin-bottom:16px;position:relative}
.news-img{width:100%;height:160px;object-fit:cover;border-radius:10px;margin-bottom:10px}
.breaking{font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px;background:#E24B4A;color:#fff;margin-right:6px}
.news-date{font-size:12px;color:#00A86B;font-weight:500}
.news-source{font-size:12px;color:#9ca3af}
.news-title{font-weight:500;font-size:15px;color:#111;padding-right:60px;margin:6px 0 4px}
.news-summary{font-size:13px;color:#6b7280;line-height:1.6}
.game-card{background:#f9fafb;border-radius:10px;padding:14px 16px;margin-bottom:10px}
.game-row{display:flex;justify-content:space-between;align-items:center}
.game-team{text-align:center;flex:1}
.game-team-name{font-size:12px;color:#6b7280;margin-top:4px}
.game-score-win{font-size:22px;font-weight:700;color:#00A86B}
.game-score-loss{font-size:22px;font-weight:700;color:#E24B4A}
.game-score-opp{font-size:22px;font-weight:700;color:#111}
.game-center{text-align:center;flex:1;font-size:12px;color:#6b7280}
.game-note{font-size:11px;color:#9ca3af;text-align:center;margin-top:6px}
.draft-item{display:flex;gap:12px;padding:12px 0;border-bottom:0.5px solid #e5e7eb;position:relative}
.draft-name{font-weight:500;font-size:15px;color:#111;margin-bottom:2px}
.draft-info{font-size:13px;color:#6b7280;margin-bottom:4px}
.agent-item{display:flex;gap:12px;padding:12px 0;border-bottom:0.5px solid #e5e7eb;align-items:center}
.agent-name{font-weight:500;font-size:15px;color:#111;margin-bottom:2px}
.agent-info{font-size:13px;color:#6b7280}
.badge{font-size:12px;font-weight:500;padding:3px 10px;border-radius:20px;white-space:nowrap}
.roster-card{background:#f9fafb;border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:center;margin-bottom:10px;position:relative}
.roster-name{font-weight:500;font-size:14px;color:#111}
.roster-pos{font-size:12px;color:#6b7280}
.roster-note{font-size:12px;color:#00A86B;margin-top:2px}
.ig-btn{position:absolute;top:8px;right:0;font-size:11px;padding:3px 8px;background:transparent;border:0.5px solid #d1d5db;border-radius:6px;cursor:pointer;color:#6b7280}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px}
.modal{background:#fff;border-radius:16px;padding:22px;max-width:380px;width:100%}
.modal-header{display:flex;justify-content:space-between;margin-bottom:14px}
.modal-close{background:none;border:none;cursor:pointer;font-size:22px;line-height:1;color:#6b7280}
.ig-preview{background:#fafafa;border:0.5px solid #e5e7eb;border-radius:10px;padding:14px;margin-bottom:12px}
.ig-avatar{width:34px;height:34px;background:#003F2D;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:11px}
.ig-img{background:#003F2D;border-radius:8px;height:110px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;overflow:hidden}
.copy-btn{width:100%;padding:10px;background:#003F2D;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500}
@media(max-width:480px){.container{padding:8px}.header{border-radius:12px}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-top">
      <div class="logo">NYJ</div>
      <div>
        <div style="font-size:21px;font-weight:700">New York Jets</div>
        <div style="font-size:12px;color:rgba(255,255,255,0.7)">Fan Hub · Live Updates · 2026</div>
      </div>
      <div style="margin-left:auto;text-align:right">
        <div style="font-size:11px;color:rgba(255,255,255,0.6)">Today</div>
        <div style="font-size:12px;color:#fff;font-weight:500" id="today-date"></div>
      </div>
    </div>
    <div class="tabs" id="tabs"></div>
  </div>
  <div class="content">
    <div class="content-header">
      <div class="content-title" id="section-title">News</div>
      <button class="refresh-btn" onclick="refresh()">↻ Refresh</button>
    </div>
    <div id="content-area"></div>
  </div>
</div>

<div class="modal-overlay" id="modal" style="display:none" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span style="font-weight:500;font-size:15px">Instagram Post</span>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
document.getElementById("today-date").textContent = new Date().toLocaleDateString("en-US",{month:"short",day:"numeric"});

const TABS = ["News","Games","NFL Draft","Free Agents","Roster","NFL News"];
const JETS_GREEN = "#003F2D";
let activeTab = "News";
let store = {};
let loadState = {};

const PROMPTS = {
  News:`Search: latest NY Jets news April 2026. Return JSON only: {"items":[{"title":"...","summary":"...","date":"Apr DD","source":"ESPN","image":"","breaking":false}]}`,
  Games:`Search: NY Jets 2025 season scores. Return JSON only: {"items":[{"opponent":"...","jetsScore":"0","oppScore":"0","date":"...","status":"final","jetsWin":true,"note":""}]}`,
  "NFL Draft":`Search: NY Jets 2026 NFL Draft picks rumors. Return JSON only: {"items":[{"round":"1","player":"...","position":"...","college":"...","note":"...","image":""}]}`,
  "Free Agents":`Search: NY Jets 2026 free agency moves. Return JSON only: {"items":[{"name":"...","position":"...","status":"signed","details":"...","image":""}]}`,
  Roster:`Search: NY Jets 2026 key players roster. Return JSON only: {"items":[{"name":"...","number":"00","position":"...","note":"...","image":""}]}`,
  "NFL News":`Search: NFL news other teams April 2026. Return JSON only: {"items":[{"title":"...","summary":"...","team":"...","date":"Apr DD","source":"ESPN","image":"","breaking":false}]}`
};

async function callAPI(prompt) {
  const res = await fetch("/api/chat", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      model:"claude-sonnet-4-20250514",
      max_tokens:2000,
      tools:[{type:"web_search_20250305",name:"web_search"}],
      messages:[{role:"user",content:prompt}]
    })
  });
  const data = await res.json();
  if (!res.ok || data.error) throw new Error(data.error?.message || "API error "+res.status);
  return (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
}

function parseJSON(raw) {
  try {
    const clean = raw.replace(/```json|```/g,"").trim();
    const s = clean.indexOf("{"), e = clean.lastIndexOf("}");
    if(s===-1||e===-1) return null;
    return JSON.parse(clean.slice(s,e+1));
  } catch(e){ return null; }
}

function avatar(name, size, round) {
  return `<div style="width:${size}px;height:${size}px;border-radius:${round?"50%":"8px"};background:${JETS_GREEN};display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:${Math.floor(size*0.28)}px;flex-shrink:0">${(name||"?").slice(0,2).toUpperCase()}</div>`;
}

function img(src, name, size, round) {
  if(!src) return avatar(name, size, round);
  return `<img src="${src}" alt="${name||""}" onerror="this.outerHTML='${avatar(name,size,round).replace(/'/g,"&#39;")}'" style="width:${size}px;height:${size}px;border-radius:${round?"50%":"8px"};object-fit:cover;flex-shrink:0"/>`;
}

function igBtn(item, abs=true) {
  return `<button class="ig-btn" ${abs?'':'style="position:static"'} onclick='openIG(${JSON.stringify(JSON.stringify(item))})'>📱 IG</button>`;
}

function renderNews(items) {
  return items.map(item=>`
    <div class="news-item">
      ${item.image?`<img src="${item.image}" class="news-img" onerror="this.style.display='none'" alt=""/>`:""}
      <div style="margin-bottom:4px">
        ${item.breaking?'<span class="breaking">BREAKING</span>':""}
        <span class="news-date">${item.date||""}</span>
        ${item.source?`<span class="news-source"> · ${item.source}</span>`:""}
      </div>
      <div class="news-title">${item.title}</div>
      <div class="news-summary">${item.summary}</div>
      ${igBtn(item)}
    </div>`).join("");
}

function renderGames(items) {
  return items.map(item=>{
    const up = item.status==="upcoming";
    return `<div class="game-card">
      <div class="game-row">
        <div class="game-team">
          <div style="width:36px;height:36px;background:${JETS_GREEN};border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:11px;margin:0 auto">NYJ</div>
          <div class="game-team-name">Jets</div>
          ${!up?`<div class="${item.jetsWin?'game-score-win':'game-score-loss'}">${item.jetsScore}</div>`:""}
        </div>
        <div class="game-center">
          <div>${up?"upcoming":"final"}</div>
          <div style="font-weight:500;margin:2px 0">${item.date||""}</div>
          ${item.note?`<div>${item.note}</div>`:""}
        </div>
        <div class="game-team">
          ${img(item.oppLogo, item.opponent, 36, false)}
          <div class="game-team-name">${item.opponent}</div>
          ${!up?`<div class="game-score-opp">${item.oppScore}</div>`:""}
        </div>
      </div>
    </div>`;
  }).join("");
}

function renderDraft(items) {
  const colors = {signed:JETS_GREEN,rumor:"#BA7517"};
  return items.map(item=>{
    const isRumor = (item.note||"").toLowerCase().includes("rumor");
    return `<div class="draft-item">
      ${img(item.image, item.player, 50, true)}
      <div style="flex:1;padding-right:60px">
        <div class="draft-name">${item.player}</div>
        <div class="draft-info">${item.position} · ${item.college}</div>
        <span class="badge" style="background:${isRumor?"#BA751722":JETS_GREEN+"22"};color:${isRumor?"#BA7517":JETS_GREEN}">${isRumor?"Rumor":"Round "+item.round}</span>
        ${item.note?`<span style="font-size:12px;color:#6b7280;margin-left:6px">${item.note}</span>`:""}
      </div>
      ${igBtn(item)}
    </div>`;
  }).join("");
}

function renderAgents(items) {
  const colors = {signed:"#00A86B",released:"#E24B4A",rumor:"#BA7517"};
  return items.map(item=>{
    const c = colors[item.status]||"#888";
    return `<div class="agent-item">
      ${img(item.image, item.name, 46, true)}
      <div style="flex:1">
        <div class="agent-name">${item.name}</div>
        <div class="agent-info">${item.position}${item.details?" · "+item.details:""}</div>
      </div>
      <span class="badge" style="background:${c}22;color:${c}">${item.status}</span>
      <button class="ig-btn" style="position:static;margin-left:6px" onclick='openIG(${JSON.stringify(JSON.stringify(item))})'>📱</button>
    </div>`;
  }).join("");
}

function renderRoster(items) {
  return items.map(item=>`
    <div class="roster-card">
      ${img(item.image, item.name, 48, true)}
      <div style="flex:1">
        <div style="display:flex;align-items:center;gap:8px">
          <div class="roster-name">${item.name}</div>
          <span style="font-size:12px;color:#00A86B;font-weight:600">#${item.number||"?"}</span>
        </div>
        <div class="roster-pos">${item.position}</div>
        ${item.note?`<div class="roster-note">${item.note}</div>`:""}
      </div>
      ${igBtn(item)}
    </div>`).join("");
}

function renderNFLNews(items) {
  return items.map(item=>`
    <div class="news-item">
      ${item.image?`<img src="${item.image}" class="news-img" onerror="this.style.display='none'" alt=""/>`:""}
      <div style="margin-bottom:4px">
        ${item.breaking?'<span class="breaking">BREAKING</span>':""}
        ${item.team?`<span style="font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;background:#f3f4f6;color:#374151;margin-right:6px">${item.team}</span>`:""}
        <span class="news-date">${item.date||""}</span>
        ${item.source?`<span class="news-source"> · ${item.source}</span>`:""}
      </div>
      <div class="news-title">${item.title}</div>
      <div class="news-summary">${item.summary}</div>
      ${igBtn(item)}
    </div>`).join("");
}

function showSpinner(msg) {
  document.getElementById("content-area").innerHTML = `<div class="spinner"><div class="spin"></div><span class="spin-text">${msg}</span></div>`;
}

function showError(msg, section) {
  document.getElementById("content-area").innerHTML = `<div class="error-box"><div class="error-title">Could not load data</div><div class="error-msg">${msg}</div><button class="retry-btn" onclick="loadSection('${section}',true)">Try again</button></div>`;
}

function renderSection(section, items) {
  const map = {News:renderNews,Games:renderGames,"NFL Draft":renderDraft,"Free Agents":renderAgents,Roster:renderRoster,"NFL News":renderNFLNews};
  document.getElementById("content-area").innerHTML = map[section](items);
}

async function loadSection(section, force) {
  if (store[section] && !force) { renderSection(section, store[section]); return; }
  loadState[section] = "loading";
  showSpinner(`Searching latest ${section} info…`);
  try {
    const raw = await callAPI(PROMPTS[section]);
    const parsed = parseJSON(raw);
    if (!parsed?.items?.length) throw new Error("Empty response: "+raw.slice(0,200));
    store[section] = parsed.items;
    loadState[section] = "done";
    renderSection(section, parsed.items);
  } catch(e) {
    loadState[section] = "error";
    showError(e.message, section);
  }
}

function setTab(t) {
  activeTab = t;
  document.getElementById("section-title").textContent = t;
  document.querySelectorAll(".tab").forEach(el=>el.classList.toggle("active",el.dataset.tab===t));
  loadSection(t);
}

function refresh() { delete store[activeTab]; loadSection(activeTab,true); }

function openIG(jsonStr) {
  const item = JSON.parse(jsonStr);
  document.getElementById("modal").style.display = "flex";
  document.getElementById("modal-body").innerHTML = `<div class="spinner"><div class="spin"></div><span class="spin-text">Generating post…</span></div>`;
  const subject = item.title||item.player||item.name||"Jets news";
  callAPI(`Create a New York Jets Instagram post about: "${subject}". Details: ${JSON.stringify(item)}.
Reply ONLY with JSON: {"caption":"engaging caption with emojis","hashtags":["#NewYorkJets","#TakeFlight","#NFL"],"cta":"follow us"}`)
    .then(raw=>{
      const post = parseJSON(raw)||{caption:"✈️ Let's Go Jets!",hashtags:["#NewYorkJets","#TakeFlight","#NFL"],cta:"Follow for daily Jets updates!"};
      const imgHtml = item.image ? `<img src="${item.image}" style="width:100%;height:100%;object-fit:cover;border-radius:8px" onerror="this.style.display='none'"/>` : `<span style="font-size:28px">✈️</span>`;
      document.getElementById("modal-body").innerHTML = `
        <div class="ig-preview">
          <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px">
            <div class="ig-avatar">NYJ</div>
            <div style="font-weight:500;font-size:13px;color:#222">newyorkjets</div>
          </div>
          <div class="ig-img">${imgHtml}</div>
          <div style="font-size:13px;line-height:1.6;color:#222;margin-bottom:6px">${post.caption}</div>
          <div style="font-size:12px;color:#3897f0;margin-bottom:6px">${(post.hashtags||[]).join(" ")}</div>
          <div style="font-size:12px;color:#888">${post.cta}</div>
        </div>
        <button class="copy-btn" id="copy-btn">Copy to clipboard</button>`;
      document.getElementById("copy-btn").onclick = () => {
        navigator.clipboard?.writeText(`${post.caption}\n\n${(post.hashtags||[]).join(" ")}\n\n${post.cta}`);
        document.getElementById("copy-btn").textContent = "Copied! ✓";
        document.getElementById("copy-btn").style.background = "#00A86B";
      };
    })
    .catch(e=>{ document.getElementById("modal-body").innerHTML=`<div class="error-box"><div class="error-title">Error</div><div class="error-msg">${e.message}</div></div>`; });
}

function closeModal() { document.getElementById("modal").style.display="none"; }

const tabsEl = document.getElementById("tabs");
TABS.forEach(t=>{
  const btn = document.createElement("button");
  btn.className = "tab"+(t===activeTab?" active":"");
  btn.dataset.tab = t;
  btn.textContent = t;
  btn.onclick = ()=>setTab(t);
  tabsEl.appendChild(btn);
});

loadSection("News");
</script>
</body>
</html>
